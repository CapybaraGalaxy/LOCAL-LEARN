<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local Learn</title>
    <meta name="description" content="Plataforma de estudio local-first sin conexión.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="css/main.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="bottom-nav" id="main-nav">
        <a href="#/home" class="nav-item active" data-route="home">
            <i data-lucide="home"></i><span>Inicio</span>
        </a>
        <a href="#/library" class="nav-item" data-route="library">
            <i data-lucide="library"></i><span>Biblioteca</span>
        </a>
        <a href="#/editor/new" class="nav-item nav-fab">
            <div class="fab" aria-label="Nueva unidad"><i data-lucide="plus"></i></div>
        </a>
        <a href="#/import" class="nav-item" data-route="import">
            <i data-lucide="download"></i><span>Importar</span>
        </a>
        <a href="#/settings" class="nav-item" data-route="settings">
            <i data-lucide="settings"></i><span>Ajustes</span>
        </a>
    </nav>

    <main id="app-root"></main>

    <div id="modal-root" class="hidden"></div>
    <div id="toast-root"></div>

    <script src="js/db.js"></script>
    <script src="js/format.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
